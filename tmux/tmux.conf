# --- General Settings ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0 # Reduced from 1 for snappier Vim response
set -g history-limit 10000

# --- Navigation & Windows ---
set-window-option -g mode-keys vi
set-window-option -g status-keys vi

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind - last-window

# Maintain current path for new splits/windows
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Copy Mode (Vim style) ---
bind Escape copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
unbind p
bind p paste-buffer

# --- Status Bar Style (Fixed Syntax) ---
set -g status-justify centre
set -g status-style bg=black,fg=white
set -g status-interval 5

set -g window-status-style fg=white,bg=default
set -g window-status-current-style fg=yellow,bg=default,bold

set -g status-left-length 90
set -g status-left "#[fg=green]#(whoami)#[fg=white]@#[fg=cyan]#(hostname -s)"
set -g status-right-length 60
set -g status-right '#[fg=magenta]#S #[fg=white]%a %d %b %R'

# lose the colon in window selector, add #F for flags
set -g window-status-format "#I#W"
set -g window-status-current-format "#I#W"

# Press Prefix + e to search emojis (by any synonym) and rename current window
# Emoji list is a local, offline cache (~/.config/tmux/emoji.json) built from
# emojilib and stripped of flags, ZWJ sequences, skin-tone modifiers and
# keycap combos, which render as broken multi-glyph clusters in this terminal.
bind-key e display-popup -E -w 40% -h 40% "jq -r 'to_entries[] | \"\\(.key) \\(.value|join(\" \"))\"' ~/.config/tmux/emoji.json | fzf --prompt='Emoji: ' | awk '{print $1}' | xargs -I {} tmux rename-window '{}'"
